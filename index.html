<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Шаурма Тайкун</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1b1236; --night2:#2a1d4f;
    --paper:#fff6e5; --paper2:#fdebc8; --edge:#e6cf9f; --ink:#3b2716; --ink2:#8a6b4a;
    --orange:#ff8a1f; --orange-d:#d96a06; --gold:#ffc93c; --gold-d:#e0a400;
    --green:#3ccf6e; --green-d:#22a04e; --blue:#3d8bfd; --blue-d:#2565c9;
    --purple:#8b5cf6; --purple-d:#6a3fd0; --red:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,var(--night2),var(--night));
    color:var(--ink);font-family:"Rubik",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
  /* Прокрутка внутри своего контейнера: работает и в iframe ВК, где прокрутка страницы отключена */
  html,body{height:100%;overflow:hidden}
  #scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:96px}

  /* ---------- верхняя панель ---------- */
  .top{position:sticky;top:0;z-index:10;padding:10px 12px 8px;display:flex;gap:8px;align-items:center;
    background:linear-gradient(180deg,rgba(27,18,54,.98),rgba(27,18,54,.85));backdrop-filter:blur(6px)}
  .pill{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.08);
    border-radius:999px;padding:4px 12px 4px 4px;color:#fff;font-weight:800}
  .coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 45%,var(--gold-d));
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:15px;color:#8a5a00;font-weight:900}
  .money{font-size:20px;font-variant-numeric:tabular-nums}
  .ips{font-size:13px;color:#b9f5cc;font-weight:700}
  .ips .ic{background:var(--green);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
  .grow{flex:1}
  .boostBadge{font-size:12px;font-weight:800;color:#fff;background:linear-gradient(180deg,#ff6b3d,#e8431a);border-radius:999px;padding:5px 9px;display:none}

  .tab{display:none;padding:4px 12px 12px;animation:fade .2s}
  .tab.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- сцена лавки ---------- */
  .sceneWrap{position:relative;border-radius:22px;overflow:hidden;border:3px solid #3d2b6e;
    box-shadow:0 6px 0 #120b26, 0 10px 30px rgba(0,0,0,.4);cursor:pointer;touch-action:manipulation}
  .sceneWrap svg{display:block;width:100%;height:auto}
  .stageTag{position:absolute;left:10px;top:10px;background:rgba(20,12,40,.75);color:#fff;border-radius:12px;
    padding:6px 10px;font-weight:800;font-size:14px;pointer-events:none}
  .stageTag small{display:block;font-weight:500;font-size:11px;color:#cdbdf5}
  .tapHint{position:absolute;right:10px;top:10px;background:var(--gold);color:#5a3a00;border-radius:12px;padding:6px 10px;
    font-weight:900;font-size:13px;pointer-events:none;box-shadow:0 3px 0 var(--gold-d)}
  .pulse{animation:pulse 1.4s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  #stallG{transform-box:fill-box;transform-origin:50% 100%}
  #stallG.bump{animation:bump .16s ease-out}
  @keyframes bump{50%{transform:scale(1.035,.965)}}
  .flick{animation:flick .25s infinite alternate}
  @keyframes flick{from{opacity:.75}to{opacity:1}}
  .b0{animation:blink 1.2s infinite} .b1{animation:blink 1.2s infinite .6s}
  @keyframes blink{50%{opacity:.25}}
  .neon{animation:neon 3s infinite}
  @keyframes neon{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:1}97%{opacity:.5}}
  .spin{animation:spin 2.4s linear infinite}
  @keyframes spin{0%{opacity:1}50%{opacity:.85}100%{opacity:1}}

  .float{position:absolute;pointer-events:none;font-weight:900;font-size:20px;color:#fff;white-space:nowrap;z-index:3;
    text-shadow:0 2px 0 var(--orange-d),0 0 6px rgba(0,0,0,.5);animation:up .9s ease-out forwards}
  .float.small{font-size:13px}
  @keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-8px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}

  .statRow{display:flex;gap:8px;margin:12px 0}
  .stat{flex:1;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 10px;color:#fff}
  .stat small{display:block;color:#cdbdf5;font-size:11px;font-weight:500}
  .stat b{font-size:16px;font-weight:800}

  h2{color:#fff;font-size:16px;font-weight:800;margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
  h2 small{color:#cdbdf5;font-weight:500;font-size:12px}

  /* ---------- карточки ---------- */
  .card{background:var(--paper);border-radius:18px;box-shadow:0 4px 0 var(--edge);padding:12px;position:relative}
  .rebuild{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;
    background:linear-gradient(135deg,#fff6e5,#ffe2b0)}
  .bigIcon{width:56px;height:56px;border-radius:16px;background:#fff;box-shadow:inset 0 -3px 0 var(--edge);
    display:flex;align-items:center;justify-content:center;font-size:32px}
  .rTitle{font-weight:800;font-size:15px}
  .rSub{font-size:12px;color:var(--ink2);margin:2px 0 6px}
  .prog{height:10px;background:#ead7b0;border-radius:6px;overflow:hidden;margin-bottom:8px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));width:0;transition:width .2s}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .upg{display:flex;flex-direction:column;gap:4px}
  .upg .head{display:flex;align-items:center;gap:8px}
  .upg .ico{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:inset 0 -3px 0 var(--edge);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .upg .nm{font-weight:800;font-size:14px;line-height:1.1}
  .upg .lv{font-size:11px;color:var(--ink2);font-weight:600}
  .upg .fx{font-size:11.5px;color:var(--ink2);min-height:28px;line-height:1.2}
  .dots{display:flex;gap:2px;margin:2px 0}
  .dots i{flex:1;height:5px;border-radius:3px;background:#ead7b0}
  .dots i.on{background:var(--orange)}

  .btn{border:0;font:inherit;font-weight:800;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);
    border-radius:12px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
    font-size:14px;transition:transform .05s,box-shadow .05s;width:100%}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
  .btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
  .btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
  .btn.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
  .btn.ghost{background:#efe2c6;color:var(--ink2);box-shadow:0 4px 0 #d8c69f}
  .btn:disabled{background:#d9cfbb;box-shadow:0 4px 0 #bfb39a;color:#fff9ee;cursor:default}
  .btn .c{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 50%,var(--gold-d));display:inline-block;flex-shrink:0}
  .maxed{text-align:center;font-weight:800;color:var(--green-d);padding:9px;font-size:13px}

  /* ---------- империя ---------- */
  .qty{width:auto;padding:6px 12px;font-size:13px}
  .biz{display:grid;grid-template-columns:68px 1fr;gap:10px;align-items:center;margin-bottom:10px}
  .biz.locked{filter:saturate(.4);opacity:.85}
  .bIcon{width:68px;height:68px;border-radius:18px;background:#fff;box-shadow:inset 0 -4px 0 var(--edge);
    display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;cursor:pointer;transition:transform .08s}
  .bIcon:active{transform:scale(.92)}
  .bIcon.ready{box-shadow:inset 0 -4px 0 var(--edge),0 0 0 3px var(--gold)}
  .bIcon.ready::after{content:"👆";position:absolute;right:-6px;top:-8px;font-size:18px;animation:pulse 1s infinite}
  .bIcon.auto{box-shadow:inset 0 -4px 0 var(--edge),0 0 0 3px var(--green)}
  .bOwned{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;
    font-size:12px;font-weight:900;padding:1px 8px;border-radius:9px;box-shadow:0 2px 0 var(--orange-d)}
  .bRow{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .bName{font-weight:800;font-size:15px}
  .bMs{font-size:11px;color:var(--ink2);white-space:nowrap}
  .bar{position:relative;height:24px;background:#ead7b0;border-radius:12px;overflow:hidden;margin:6px 0}
  .bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--green-d),var(--green))}
  .bar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;
    font-size:12.5px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
  .bBtns{display:grid;grid-template-columns:1fr 112px;gap:6px}
  .bBtns .btn{font-size:12.5px;padding:7px 6px;line-height:1.1;flex-direction:column;gap:1px}
  .bBtns .btn small{font-weight:600;font-size:11px;opacity:.9;display:flex;align-items:center;gap:4px}

  /* ---------- бонусы ---------- */
  .bonus{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;margin-bottom:10px}
  .bonus p{margin:2px 0 8px;font-size:12.5px;color:var(--ink2);line-height:1.35}

  /* ---------- нижнее меню ---------- */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 10px 10px}
  .navIn{width:100%;max-width:460px;background:var(--paper);border-radius:22px;box-shadow:0 4px 0 var(--edge),0 -4px 20px rgba(0,0,0,.3);
    display:grid;grid-template-columns:repeat(3,1fr);padding:6px}
  .nb{border:0;background:transparent;font:inherit;padding:6px 4px;border-radius:16px;cursor:pointer;color:var(--ink2);
    font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
  .nb span{font-size:24px;line-height:1}
  .nb.on{background:linear-gradient(180deg,var(--orange),var(--orange-d));color:#fff}
  .nb .dot{position:absolute;top:4px;right:22%;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--paper);display:none}

  /* ---------- модалки ---------- */
  .modalBg{position:fixed;inset:0;background:rgba(10,5,25,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
  .modalBg.show{display:flex}
  .modal{background:var(--paper);border-radius:24px;box-shadow:0 6px 0 var(--edge);padding:22px 18px 18px;max-width:340px;width:100%;text-align:center;animation:pop .25s}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .modal .em{font-size:52px;line-height:1}
  .modal h3{margin:6px 0 4px;font-size:21px;font-weight:900}
  .modal p{color:var(--ink2);margin:6px 0 12px;font-size:14px;line-height:1.4}
  .modal .big{font-size:30px;font-weight:900;color:var(--orange);margin:4px 0 14px}
  .modal .btn{margin-top:8px;padding:12px;font-size:15px}
  .adScreen{position:fixed;inset:0;background:#000;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-weight:700}
  .adScreen.show{display:flex}
  .adScreen .cnt{font-size:60px;font-weight:900;margin-top:10px}
  .toast{position:fixed;left:50%;top:112px;transform:translateX(-50%) translateY(-20px);opacity:0;z-index:25;
    background:var(--paper);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:14px;box-shadow:0 4px 0 var(--edge),0 8px 20px rgba(0,0,0,.35);
    font-size:14px;transition:all .25s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ---------- новое: звук, эффекты, события ---------- */
  .top{flex-wrap:wrap}
  .iconBtn{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.1);background:rgba(0,0,0,.35);
    color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .fxRow{width:100%;display:flex;gap:6px;flex-wrap:wrap}
  .fxRow:empty{display:none}
  .chip{background:linear-gradient(180deg,#ff6b3d,#e8431a);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;animation:fade .3s}
  .chip.g{background:linear-gradient(180deg,#3ccf6e,#22a04e)}
  .chip.b{background:linear-gradient(180deg,#5aa0ff,#2565c9)}
  .chip.p{background:linear-gradient(180deg,#a47bff,#6a3fd0)}
  .pill.bump{animation:pbump .18s}
  @keyframes pbump{50%{transform:scale(1.08)}}
  .flyCoin{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;z-index:40;pointer-events:none;
    background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 45%,var(--gold-d));box-shadow:0 0 6px rgba(255,201,60,.8);
    transition:transform .55s cubic-bezier(.45,-0.35,.7,1),opacity .55s}
  .evtBubble{position:absolute;left:4%;bottom:24%;z-index:4;border:0;background:#fff;border-radius:18px;padding:6px 10px 10px;
    font-size:28px;line-height:1;box-shadow:0 4px 0 #d8c69f,0 0 0 4px rgba(255,201,60,.7);cursor:pointer;display:none;
    align-items:center;gap:4px;animation:evt 1s ease-in-out infinite}
  .evtBubble.show{display:flex}
  .evtBubble b{background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;font-size:15px;display:flex;align-items:center;justify-content:center}
  .evtBubble .ttl{position:absolute;left:10px;right:10px;bottom:4px;height:3px;background:#eee;border-radius:2px;overflow:hidden}
  .evtBubble .ttl i{display:block;height:100%;background:var(--orange)}
  @keyframes evt{50%{transform:translateY(-6px)}}
  .golden{position:absolute;z-index:4;font-size:36px;line-height:1;cursor:pointer;display:none;margin:-18px 0 0 -18px;
    filter:drop-shadow(0 0 6px #ffd93c) drop-shadow(0 0 14px #ffb300)}
  .golden.show{display:block}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:26;width:100vw;height:100vh}
  .shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .modal .stack{display:flex;flex-direction:column}
  .vkTag{font-size:11px;color:#cdbdf5;text-align:center;margin-top:14px}
  /* локации */
  .locBar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
  .locBar::-webkit-scrollbar{display:none}
  .restBar{display:flex;gap:8px;margin:2px 0 8px}
  .restBtn{flex:1;border:0;font:inherit;font-weight:900;font-size:14px;padding:8px;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.08);color:#cdbdf5;border:2px solid rgba(255,255,255,.1)}
  .restBtn.on{background:#fff6e5;color:#3b2716;border-color:#ffc93c;box-shadow:0 3px 0 #e0a400}
  .restBtn.locked{opacity:.75}
  .restBtn small{font-weight:700;font-size:11px;opacity:.8}
  .restBtn{white-space:nowrap;font-size:13px;padding:8px 6px;overflow:hidden;text-overflow:ellipsis}
  .locBtn.nyc.on{background:linear-gradient(180deg,#ffd23f,#e09f00);box-shadow:0 3px 0 #9c6f00}
  .locBtn.par.on{background:linear-gradient(180deg,#9b8cff,#5a4bd1);box-shadow:0 3px 0 #3a2f99}
  .locBtn.rio.on{background:linear-gradient(180deg,#3ccf6e,#16934a);box-shadow:0 3px 0 #0e6633}
  .locBtn.cai.on{background:linear-gradient(180deg,#ffa94d,#d9480f);box-shadow:0 3px 0 #9a3209}
  .locBtn.pole.on{background:linear-gradient(180deg,#7fd8ff,#2f86c9);box-shadow:0 3px 0 #1d5a8a}
  .prog.thin{height:8px;margin:4px 0 8px}
  .locBtn{min-width:0;border:0;font:inherit;font-weight:800;padding:6px 2px;border-radius:14px;background:rgba(255,255,255,.08);
    color:#cdbdf5;cursor:pointer;font-size:14px;border:2px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:6px}
  .locBtn.on{background:linear-gradient(180deg,#ff9a3c,#e8641a);color:#fff;box-shadow:0 3px 0 #b84a0c;border-color:transparent}
  .locBtn.mia.on{background:linear-gradient(180deg,#ff6fb5,#c43d8b);box-shadow:0 3px 0 #8f2563}
  .locBtn.tky.on{background:linear-gradient(180deg,#f72585,#7209b7);box-shadow:0 3px 0 #4a0677}
  .locBtn.dxb.on{background:linear-gradient(180deg,#f6c453,#c8901a);box-shadow:0 3px 0 #8c6210}
  .locBtn.moon.on{background:linear-gradient(180deg,#6b7a99,#2f3a55);box-shadow:0 3px 0 #1b2236}
  .locBtn{flex-direction:column;gap:1px;line-height:1.1;font-size:11.5px;text-align:center}
  .locBtn .li{font-size:20px;line-height:1}
  .locBtn .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .locBtn small{font-size:10px;font-weight:700;opacity:.85;white-space:nowrap}
  .locBtn.locked{opacity:.8}
  .locBtn.glow{animation:pulse 1.2s infinite}
  /* меню */
  .menuItem{display:grid;grid-template-columns:44px 1fr 116px;gap:10px;align-items:center;margin-bottom:8px;padding:10px}
  .menuItem .ico{width:44px;height:44px;border-radius:12px;background:#fff;box-shadow:inset 0 -3px 0 var(--edge);display:flex;align-items:center;justify-content:center;font-size:24px}
  .menuItem .nm{font-weight:800;font-size:14px}
  .menuItem .ds{font-size:12px;color:var(--ink2)}
  .menuItem.owned{background:linear-gradient(135deg,#eafff0,#d6f7e1);box-shadow:0 4px 0 #b6e3c4}
  .menuItem .btn{font-size:13px;padding:8px 6px}
  .menuItem .ok{font-weight:800;color:var(--green-d);text-align:center;font-size:13px}
  /* инвестиции */
  .invBtn{margin-top:6px;font-size:12.5px;padding:7px 8px;justify-content:space-between}
  .invBtn .stars{letter-spacing:1px;font-size:12px}
</style>
<!-- VK Bridge: внутри ВКонтакте даёт доступ к рекламе, облачным сохранениям и т.д. -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
<div id="scroller"><div id="app">
  <div class="top">
    <div class="pill"><div class="coin">₽</div><span class="money" id="money">0</span></div>
    <div class="pill ips"><div class="ic">▲</div><span id="ips">0/с</span></div>
    <div class="grow"></div>
    <button class="iconBtn" id="muteBtn" title="Звук">🔊</button>
    <div class="fxRow" id="fxRow"></div>
  </div>

  <!-- ===== ЛАВКА ===== -->
  <section class="tab on" id="tab-stall">
    <div class="restBar" id="restBar"></div>
    <div class="locBar" id="locBar"></div>
    <div class="sceneWrap" id="scene">
      <svg viewBox="0 -40 400 360" id="svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#22134a"/><stop offset=".55" stop-color="#7a2f7a"/><stop offset="1" stop-color="#ff8a5c"/>
          </linearGradient>
          <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd58a"/><stop offset="1" stop-color="#ff9f43"/>
          </linearGradient>
          <linearGradient id="meat" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#7a3b12"/><stop offset=".45" stop-color="#d9822b"/><stop offset="1" stop-color="#7a3b12"/>
          </linearGradient>
          <radialGradient id="lampGlow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".7"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>

const Sound = {
  ctx:null, master:null, muted:false, noise:null, noiseGain:null,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended' && !document.hidden) this.ctx.resume(); return; }
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:0.5; this.master.connect(this.ctx.destination);
      // шипение гриля — отфильтрованный шум
      const len=this.ctx.sampleRate*2, buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(0.6+0.4*Math.random());
      const src=this.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
      const bp=this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=4200; bp.Q.value=0.8;
      this.noiseGain=this.ctx.createGain(); this.noiseGain.gain.value=0;
      src.connect(bp); bp.connect(this.noiseGain); this.noiseGain.connect(this.master); src.start();
    }catch(e){ this.ctx=null; }
  },
  setMuted(m){
    this.muted=m; try{ localStorage.setItem('larek_mute', m?'1':'0'); }catch(e){}
    if(this.master) this.master.gain.setTargetAtTime(m?0:0.5, this.ctx.currentTime, 0.05);
  },
  tone(freq, dur, type='sine', vol=0.2, when=0, slideTo){
    if(this.muted||!this.ctx) return;
    const t=this.ctx.currentTime+when, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.03);
  },
  coin(){ const p=1+(Math.random()*0.1-0.05); this.tone(988*p,0.07,'square',0.05); this.tone(1319*p,0.16,'square',0.05,0.055); },
  buy(){ [523,659,784].forEach((f,i)=>this.tone(f,0.13,'triangle',0.16,i*0.06)); },
  fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,i===5?0.55:0.14,'square',0.07,i*0.11)); },
  event(){ this.tone(1568,0.3,'sine',0.14); this.tone(2093,0.45,'sine',0.1,0.12); },
  bad(){ this.tone(330,0.25,'sawtooth',0.06,0,180); this.tone(220,0.4,'sawtooth',0.06,0.22,100); },
  gold(){ [1047,1319,1568,2093,2637].forEach((f,i)=>this.tone(f,0.12,'sine',0.12,i*0.05)); },
  click(){ this.tone(700,0.04,'triangle',0.07); },
  ambient(on){ if(this.noiseGain) this.noiseGain.gain.setTargetAtTime(on&&!this.muted?0.035:0, this.ctx.currentTime, 0.4); },
};

const confetti=[]; let cv, cx2;
function setupConfetti(){
  cv=$('confetti'); cx2=cv.getContext('2d');
  const rs=()=>{ const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; cx2.setTransform(d,0,0,d,0,0); };
  rs(); addEventListener('resize', rs);

function confettiBurst(n, x, y){
  if(x===undefined){ const r=$('scene').getBoundingClientRect(); x=r.left+r.width/2; y=r.top+r.height*0.45; }
  const cols=['#ff5e5e','#ffd93c','#5ee1ff','#7dff6b','#ff8af0','#ff8a1f','#fff'];
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=3+Math.random()*7;
    confetti.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[i%cols.length],w:5+Math.random()*5,h:3+Math.random()*4,life:1.6+Math.random()}); }
}
function drawConfetti(dt){
  if(!cx2) return;
  cx2.clearRect(0,0,innerWidth,innerHeight);
  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i]; p.life-=dt; if(p.life<=0){ confetti.splice(i,1); continue; }
    p.vy+=18*dt; p.vx*=0.99; p.x+=p.vx*dt*60; p.y+=p.vy*dt*60*0.5; p.r+=p.vr;
    cx2.save(); cx2.globalAlpha=Math.min(1,p.life); cx2.translate(p.x,p.y); cx2.rotate(p.r);
    cx2.fillStyle=p.c; cx2.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx2.restore();
  }
}

function fmt(n){
  if(n<1000) return (n<10 && n%1>0.05 ? n.toFixed(1) : Math.floor(n).toString());
  if(!isFinite(n)) return '∞';
  if(n>=1e66) return n.toExponential(2).replace('e+','e');
  const k=Math.min(SUF.length-1, Math.floor(Math.log10(n)/3));
  const v=n/Math.pow(1000,k);
  let t=v>=100? v.toFixed(0) : v.toFixed(v>=10?1:2); if(t.includes('.')) t=t.replace(/\.?0+$/,''); return t+SUF[k];
}

const customers=[]; let spawnT=0;
const SHIRTS=['#ff6b6b','#4ecdc4','#ffd93d','#6c5ce7','#00b894','#fd79a8','#0984e3','#e17055'];
const SKIN=['#f2c08a','#e0a370','#c68642','#ffdbac','#8d5524'];
function tickCustomers(dt){
  spawnT-=dt;
  const interval=Math.max(0.7, 5 - S.stage*0.7 - S.lv.sign*0.2 - S.lv.seller*0.1);
  if(spawnT<=0 && customers.length<7){
    spawnT=interval*(0.6+Math.random()*0.8);
    const fromLeft=Math.random()<.5;
    customers.push({x:fromLeft?-15:415, dir:fromLeft?1:-1, stop:200+(Math.random()*60-30), st:'in', wait:0, t:Math.random()*5,
      shirt:SHIRTS[Math.floor(Math.random()*SHIRTS.length)], skin:SKIN[Math.floor(Math.random()*SKIN.length)], y:G+14+Math.random()*8});
  }
  for(const c of customers){
    c.t+=dt;
    const spd=S.loc==='moon'?0.55:1;
    if(c.st==='in'){ c.x+=c.dir*45*spd*dt; if((c.dir>0&&c.x>=c.stop)||(c.dir<0&&c.x<=c.stop)){ c.st='wait'; c.wait=1+Math.random(); } }
    else if(c.st==='wait'){ c.wait-=dt; if(c.wait<=0){ c.st='out'; c.food=true; } }
    else c.x+=c.dir*50*spd*dt;
  }
  for(let i=customers.length-1;i>=0;i--) if(customers[i].x<-30||customers[i].x>430) customers.splice(i,1);
  customers.sort((a,b)=>a.y-b.y);
  let s='';
  for(const c of customers){
    const bob=c.st==='wait'?0:Math.abs(Math.sin(c.t*9))*2, leg=c.st==='wait'?0:Math.sin(c.t*9)*4;
    s+=`<g transform="translate(${c.x.toFixed(1)},${(c.y-bob).toFixed(1)})">
      <line x1="-3" y1="-4" x2="${-3+leg}" y2="6" stroke="#2b2240" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="3" y1="-4" x2="${3-leg}" y2="6" stroke="#2b2240" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-8" y="-24" width="16" height="22" rx="7" fill="${c.shirt}"/>
      <circle cx="0" cy="-31" r="7" fill="${c.skin}"/>
      ${(S.loc==='mia'||S.loc==='dxb')?'<rect x="-6.5" y="-34" width="13" height="3.5" rx="1.7" fill="#1a1a2e"/>':''}
      ${S.loc==='pole'?'<path d="M-7 -35 q7 -12 14 0z" fill="#e63946"/><circle cx="0" cy="-42" r="2.5" fill="#fff"/>':''}
      ${S.loc==='moon'?'<circle cx="0" cy="-31" r="11" fill="#bfe6ff" fill-opacity=".25" stroke="#fff" stroke-width="2"/><rect x="-5" y="-12" width="10" height="9" rx="2" fill="#e5e7eb"/>':''}
      ${S.loc==='tky'&&c.shirt>'#8'?'<path d="M-7 -36 q7 -8 14 0z" fill="#1a1a2e"/>':''}
      ${c.food?`<text x="${c.dir>0?5:-17}" y="-12" font-size="12">${RESTS[LOCS[S.loc].rest].food}</text>`:''}
      ${c.st==='wait'?`<text x="-6" y="-42" font-size="11">💬</text>`:''}
    </g>`;
  }
  $('custG').innerHTML=s;
}

  let own=0, firstHidden=false;
  MENU.forEach((d,k)=>{
    const o=menuEls[d.id], has=!!S.menu[d.id]; if(has) own++;

      gEl.style.transform=`rotate(${Math.sin(gold.t*5)*20}deg)`; }
  } else if(tab==='stall' && !modalOpen() && S.taps>=10){
    goldTimer-=dt; if(goldTimer<=0){ gold={t:0,dur:7,dir:Math.random()<.5?1:-1,y:rand(18,40)}; gEl.classList.add('show'); Sound.event(); }
  }
}
function catchGold(e){
  e.stopPropagation(); if(!gold) return;
  const r=Math.max(tapValue()*15, totalPerSec()*20);
  earn(r); gold=null; $('golden').classList.remove('show'); goldTimer=rand(45,100);
  Sound.gold(); confettiBurst(70, e.clientX, e.clientY); flyCoin(e.clientX,e.clientY);
  toast('🌟 Золотая шаурма! +'+fmt(r)+' ₽');
}

/* =========================================================
   ДРУЗЬЯ И СТЕНА
   ========================================================= */
function inviteFriends(){
  if(Date.now()<S.inviteAt+COOLDOWN) return;
  Platform.invite(ok=>{ if(!ok) return; const r=socialReward(300); earn(r); S.inviteAt=Date.now();
    Sound.fanfare(); confettiBurst(90); toast('👥 Спасибо! +'+fmt(r)+' ₽'); save(true); });
}
function shareWall(){
  if(Date.now()<S.shareAt+COOLDOWN) return;
  const text=`Моя шаурмичная «${stageInfo(S.stage).name}» (${LOCS[S.loc].name}) приносит ${fmt(totalPerSec(false))} ₽ в секунду! 🌯 А ты сможешь круче? Играй в «Шаурма Тайкун»`;
  Platform.share(text, ok=>{ if(!ok) return; const r=socialReward(180); earn(r); S.shareAt=Date.now();
    Sound.fanfare(); confettiBurst(90); toast('📣 Опубликовано! +'+fmt(r)+' ₽'); save(true); });
}

/* =========================================================
   ЦИКЛ
   ========================================================= */
let sellerAcc=0, sellerFloatT=0;
function tick(dt){
  // продавцы лавки
  const sps=stallPerSec();
  if(sps>0){
    earn(sps*dt);
    sellerFloatT-=dt;
    if(sellerFloatT<=0 && tab==='stall' && S.lv.seller>0){ sellerFloatT=1.2; const wrap=$('scene'), w=wrap.clientWidth;
      floatAt(wrap, w*0.6, w*0.38, '+'+fmt(sellerPsOf(S.loc)*1.2), 'small'); }
  }
  checkUnlockHint();
  if(FX.length) FX=FX.filter(f=>f.until>Date.now());
  BIZ.forEach((b,i)=>{
    if(!S.owned[i]||!(S.managers[i]||S.running[i])) return;
    S.progress[i]+=dt; const ct=cycleTime(i);
    if(S.progress[i]>=ct){
      if(S.managers[i]){ const n=Math.floor(S.progress[i]/ct); earn(cycleRev(i)*n); S.progress[i]-=n*ct; }
      else { earn(cycleRev(i)); S.progress[i]=0; S.running[i]=false; }
    }
  });
}
let last=performance.now(), ambT=0;
function loop(now){
  const dt=Math.min(1,(now-last)/1000); last=now;
  tick(dt); tickEvents(dt); if(tab==='stall') tickCustomers(dt); render(); drawConfetti(dt);
  ambT-=dt; if(ambT<=0){ ambT=1; Sound.ambient(tab==='stall' && S.lv.grill>0 && !document.hidden); }
  requestAnimationFrame(loop);
}

/* =========================================================
   СОХРАНЕНИЕ
   ========================================================= */
function save(force){ S.lastSave=Date.now(); Platform.saveLocal(S); Platform.saveCloud(S, force); }
function applySave(d){
  if(!d || !Array.isArray(d.owned) || d.owned.length!==BIZ.length) return false;
  d=Object.assign({}, d);
  if(!d.stalls){ d.stalls={msk:{stage:d.stage||0, lv:Object.assign(defaultLv(), d.lv||{})}}; }
  if(!d.open){ d.open={msk:true}; if(d.miaOpen) d.open.mia=true; }
  delete d.miaOpen; delete d.miaHinted;
  delete d.stage; delete d.lv;
  S=Object.assign(freshState(), d);
  S.hinted=S.hinted||{};
  for(const k of LOC_ORDER){ S.stalls[k]=Object.assign({stage:0}, S.stalls[k]||{}); S.stalls[k].lv=Object.assign(defaultLv(), S.stalls[k].lv||{}); }
  if(!Array.isArray(S.inv)||S.inv.length!==BIZ.length) S.inv=BIZ.map((_,i)=>(S.inv&&S.inv[i])||0);
  S.menu=S.menu||{}; if(!locOpen(S.loc)) S.loc='msk';
  applyLocVisual();
  const away=Math.min(OFFLINE_CAP,(Date.now()-S.lastSave)/1000), gain=totalPerSec(false)*away*OFFLINE_RATE;
  if(away>30 && gain>0){
    earn(gain);
    modal(`<div class="em">🌙</div><h3>С возвращением!</h3><p>Пока вас не было ${fmtTime(away)}, лавка и менеджеры заработали:</p>
      <div class="big">+${fmt(gain)} ₽</div>
      <button class="btn blue" id="oAd">📺 Забрать ×3 за рекламу</button><button class="btn ghost" id="oOk">Забрать</button>`);
    $('oAd').onclick=()=>{ closeModal(); Platform.showRewarded(ok=>{ if(ok){ earn(gain*2); Sound.gold(); confettiBurst(80); toast('💰 Ещё +'+fmt(gain*2)+' ₽'); save(true); } }); };
    $('oOk').onclick=()=>{ closeModal(); Sound.coin(); };
  }
  S.lastSave=Date.now();
  return true;
}

/* =========================================================
   СТАРТ
   ========================================================= */
buildBackdrop(); buildMiami(); buildTokyo(); buildDubai(); buildMoon(); buildNYC(); buildParis(); buildRio(); buildCairo(); buildPole(); buildRestBar(); buildLocBar(); buildUpgrades(); buildMenu(); buildBiz(); setupConfetti();
try{ Sound.muted = localStorage.getItem('larek_mute')==='1'; }catch(e){}
$('muteBtn').textContent = Sound.muted ? '🔇' : '🔊';
const localSave=Platform.loadLocal();
const hadSave=applySave(localSave);
// внутри ВК: инициализация и подгрузка облачного сохранения (если оно новее локального)
Platform.init().then(async()=>{
  if(!Platform.inVK) return;
  const c=await Platform.loadCloud();
  if(c && (!localSave || (c.lastSave||0) > (localSave.lastSave||0)+5000)){ closeModal(); applySave(c); toast('☁️ Прогресс загружен из облака'); }
});
document.addEventListener('pointerdown', ()=>Sound.init());
$('muteBtn').onclick=()=>{ Sound.init(); Sound.setMuted(!Sound.muted); $('muteBtn').textContent=Sound.muted?'🔇':'🔊'; };
$('evtBubble').addEventListener('pointerdown', e=>{ e.stopPropagation(); openEvent(); });
$('golden').addEventListener('pointerdown', catchGold);
$('invBtn').onclick=inviteFriends; $('shBtn').onclick=shareWall;
$('scene').addEventListener('pointerdown', tapStall);
$('rbBtn').onclick=rebuild;
$('qtyBtn').onclick=()=>{ qtyMode=(qtyMode+1)%QTY.length; };
$('boostBtn').onclick=boost; $('repBtn').onclick=askPrestige;
document.querySelectorAll('.nb').forEach(b=>b.addEventListener('click',()=>{ Sound.click(); showTab(b.dataset.tab); }));
$('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });
setInterval(()=>save(),5000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ save(true); Sound.ambient(false); if(Sound.ctx) Sound.ctx.suspend(); } else if(Sound.ctx) Sound.ctx.resume(); });
window.addEventListener('pagehide', ()=>save(true));
if(!hadSave) setTimeout(()=>toast('👆 Жмите на тележку — продавайте шаурму!'),400);
requestAnimationFrame(loop);
</script>
